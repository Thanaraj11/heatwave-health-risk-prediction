version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: heatwave-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: "http://<your-ec2-public-ip>:8000"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped